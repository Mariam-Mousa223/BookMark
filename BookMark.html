<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="BookMark.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar / Form Area -->
        <aside class="sidebar">
            <div class="brand">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                <h2>Bookmark<span>Hub</span></h2>
            </div>

            <div class="shortcuts-card">
                <div class="shortcut-item"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> <span>Add</span></div>
                <div class="shortcut-item"><kbd>Esc</kbd> <span>Cancel Edit</span></div>
                <div class="shortcut-item"><kbd>/</kbd> <span>Focus Search</span></div>
            </div>

            <form id="bookmarkForm" class="form-card" onsubmit="event.preventDefault();">
                <h3 id="formTitle">Add New Bookmark</h3>
                
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="titleInput" placeholder="e.g. GitHub" required>
                </div>

                <div class="input-group">
                    <label>Target URL</label>
                    <input type="url" id="urlInput" placeholder="e.g. https://github.com" required>
                </div>

                <div class="input-group">
                    <label>Tag</label>
                    <input type="text" id="tagInput" placeholder="e.g. dev, design, news">
                </div>

                <div class="form-actions">
                    <button type="button" id="saveBtn" class="btn-primary">
                        <span id="saveBtnText">Save Bookmark</span>
                    </button>
                    <button type="button" id="cancelBtn" class="btn-secondary hidden">Cancel</button>
                </div>
            </form>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Dashboard Bar -->
            <header class="top-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by title or tag... (Press '/' to focus)">
                </div>
                <div class="stats-badge">
                    <span id="countBadge">0</span> Bookmarks
                </div>
            </header>

            <!-- Cards Grid -->
            <div id="bookmarkList" class="card-grid"></div>
        </main>
    </div>

    <script src="BookMark.js"></script>
</body>
</html>
